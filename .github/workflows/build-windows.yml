name: Build Hermes-Setup.exe (Windows)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to build (default: main)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || 'main' }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/bootstrap-installer/package-lock.json

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/bootstrap-installer/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2

      - name: Install frontend dependencies
        working-directory: apps/bootstrap-installer
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Hermes-Setup.exe)
        working-directory: apps/bootstrap-installer
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Setup.exe
          path: apps/bootstrap-installer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 7

      - name: Also upload raw exe
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Setup-raw.exe
          path: apps/bootstrap-installer/src-tauri/target/x86_64-pc-windows-msvc/release/Hermes-Setup.exe
          retention-days: 7

      - name: Create release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/x86_64-pc-windows-msvc/release/Hermes-Setup.exe
            apps/bootstrap-installer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
